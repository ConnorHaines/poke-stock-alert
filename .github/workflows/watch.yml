name: Stock watch

# Each run keeps checking for ~55 minutes. As it starts, it queues the next
# run, which waits in the concurrency group and takes over the moment this one
# ends. GitHub's cron is too unreliable to depend on (it can skip hours), so it
# is only a backup that restarts the chain if it ever breaks.
#
# To stop everything: Actions tab > Stock watch > "..." > Disable workflow.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: stock-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Check shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 watcher.py --loop-minutes 55 --git-commit
